<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="shivamNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E36"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="shivamGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (Architectural Skyline & Geometric Hexagon) -->
  <g transform="translate(6, 4)">
    <!-- Base Hexagon Frame -->
    <polygon points="26,2 50,15 50,43 26,56 2,43 2,15" fill="url(#shivamNavyGrad)" stroke="url(#shivamGoldGrad)" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Stylized Modern High-Rise Skyline -->
    <!-- Tower 1 (Left) -->
    <rect x="12" y="24" width="7" height="22" fill="#3B82F6" opacity="0.8"/>
    <!-- Tower 2 (Center High-Rise) -->
    <rect x="21" y="14" width="10" height="32" fill="url(#shivamGoldGrad)"/>
    <!-- Tower 3 (Right) -->
    <rect x="33" y="20" width="7" height="26" fill="#60A5FA" opacity="0.9"/>
    
    <!-- Architectural Glass Window Notches -->
    <line x1="24" y1="18" x2="28" y2="18" stroke="#0F1E36" stroke-width="1.2"/>
    <line x1="24" y1="23" x2="28" y2="23" stroke="#0F1E36" stroke-width="1.2"/>
    <line x1="24" y1="28" x2="28" y2="28" stroke="#0F1E36" stroke-width="1.2"/>
    <line x1="24" y1="33" x2="28" y2="33" stroke="#0F1E36" stroke-width="1.2"/>
    
    <!-- Ground Baseline & Foundation Accent -->
    <line x1="8" y1="46" x2="44" y2="46" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Main Brand Typography (For Light Background) -->
  <text x="66" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" fill="#0F1E36" letter-spacing="1.2">SHIVAM PROPERTY</text>
  <text x="67" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#D97706" letter-spacing="2.2">COMMERCIAL &amp; LUXURY REAL ESTATE • BHOPAL</text>
  <text x="67" y="53" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="7.5" fill="#64748B" letter-spacing="1.4">M.P. NAGAR ZONE-2 • CORPORATE LEASING • ESTD. 2006</text>
</svg>
